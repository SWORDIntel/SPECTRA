# Dataset configuration
dataset:
  # URL to download dataset archive (tar.gz). Set to empty to skip download.
  url: ""
  # Local path on VM where dataset is extracted
  path: "/opt/training-repo/training/spectra_operator/data"
  # Minimum number of files expected in dataset (re-download if fewer)
  min_files: 1

# Output configuration
output:
  # Base directory for model outputs (relative to repo root)
  dir: training/cloud_training_framework/models
  # Report directory
  report_dir: training/cloud_training_framework/reports

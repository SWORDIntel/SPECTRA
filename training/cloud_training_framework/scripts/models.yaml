# Cloud GPU Training Framework — Model Pipeline Definition
#
# Define your training pipeline here. The run_pipeline.py script reads this
# file and runs each model sequentially, skipping completed ones.
#
# Each model entry:
#   name:         Unique identifier (used in pipeline_state.json)
#   display_name: Human-readable name for TUI dashboard
#   script:       Path to training script (relative to repo root)
#   args:         Command-line arguments (list of strings)
#                 Use $DATA_DIR, $OUTPUT_DIR, $REPO_DIR as placeholders
#   output_dir:   Where model artifacts are saved (relative to repo root)
#   log_file:     Where to redirect training logs (optional, default /tmp/<name>.log)
#   optional:     If true, failure doesn't block the pipeline (default: false)

models:
  - name: spectra_operator_qwen7b
    display_name: "SPECTRA Operator - Qwen2.5-7B LoRA"
    script: training/spectra_operator/train_spectra_operator.py
    args:
      - "--base-model"
      - "Qwen/Qwen2.5-7B-Instruct"
      - "--data-path"
      - "$REPO_DIR/training/spectra_operator/data/train.jsonl"
      - "--output-dir"
      - "$OUTPUT_DIR/spectra-operator-qwen7b"
      - "--epochs"
      - "3"
      - "--batch-size"
      - "2"
      - "--grad-accum"
      - "8"
      - "--lora-r"
      - "32"
      - "--max-length"
      - "2048"
    output_dir: training/cloud_training_framework/models/spectra-operator-qwen7b
    log_file: /tmp/train_spectra_operator_qwen7b.log

  # NetFix remains as a copied reference pattern. Its generated JSONL data is not

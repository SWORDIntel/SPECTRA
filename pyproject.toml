[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-archive"
version = "1.0.0"
description = "Telegram archiving & discovery toolkit (SPECTRA)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "John Reese", email = "intel@swordintelligence.airforce"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Topic :: Communications :: Chat",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "telethon>=1.34",
    "rich>=13",
    "tqdm>=4",
    "pyyaml>=6",
    "Pillow>=10",
    "npyscreen>=4.10",
    "jinja2>=3",
    "networkx>=3.0",
    "matplotlib>=3.6",
    "pandas>=1.5",
    "python-magic>=0.4.27",
    "fido2>=2.1.1",
    "pyaes>=1.6.1",
    "pyasn1>=0.6.0",
    "feedgen>=0.9.0",
    "lxml>=4.9.2",
    "pytz>=2023.3",
    "croniter>=1.3.5",
    "aiosqlite>=0.20.0",
    "aiofiles>=23.2.1",
    "requests>=2.31.0",
    "watchdog>=2.1.6",
    "PyJWT>=2.8.0",
    "flask>=2.3.3",
    "flask-socketio>=5.3.6",
    "flask-cors>=4.0.0",
    "yoyo-migrations>=8.2.0",
    "datasketch>=1.6.4",
    "imagehash>=4.3.1",
    "pysocks>=1.7.1",
]

[project.scripts]
spectra = "tgarchive.__main__:main"

[tool.setuptools.packages.find]
include = ["tgarchive*", "spectra_app*", "src*"]
